<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>INTRODUÇÃO A HTML: BÁSICO</title>
</head>
<body>
    <!-- 1 - Titulo h1, h2, h3, h4, h5, h6 -->
    <h1>Titulo</h1>
    <h2>Titulo</h2>
    <h3>Titulo</h3>
    <h4>Titulo</h4>
    <h5>Titulo</h5>
    <h6>Titulo</h6>
    <!-- 2 - Paragráfo p -->
    <p>Um paragrafo</p>
    <p>Um texto no Paragráfo</p>
    <!-- 3 - Comentario -->
    <!-- 4 - Tags sem conteudo br e hr -->
    <p>paragrafo</p>
    <br>
    <p>Outro paragrafo</p>
    <p>Mais um paragrafo></p>
    <hr>
</body>
</html>
